<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Boards</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #140e22;
        --panel: #1e1630;
        --ink: #f1e4c6;
        --dim: #a8987c;
        --brass: #c9963a;
        --saffron: #f0a92b;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 Inter, system-ui, sans-serif;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      h1,
      h2 {
        font-family: 'Pixelify Sans', monospace;
        font-weight: 600;
        color: var(--saffron);
        margin: 0 0 4px;
      }
      h1 {
        font-size: 32px;
      }
      h2 {
        font-size: 22px;
        margin-top: 36px;
      }
      .note {
        color: var(--dim);
        margin: 0 0 14px;
      }
      .grid {
        columns: 280px;
        column-gap: 16px;
      }
      figure {
        break-inside: avoid;
        margin: 0 0 16px;
        background: var(--panel);
        border: 1px solid #3a2a4a;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 10px 12px 12px;
        font-size: 13px;
      }
      figcaption ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      .credit {
        color: var(--dim);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mood Boards</h1>
      <p class="note">Every reference image pasted into the project, grouped by board. Source of truth: <code>moodboards/boards.json</code>.</p>
      <div id="boards"></div>
    </main>
    <script type="module">
      const data = await fetch('/moodboards/boards.json').then((r) => r.json());
      const root = document.getElementById('boards');
      for (const [id, board] of Object.entries(data.boards)) {
        const imgs = data.images.filter((i) => i.boards.includes(id));
        if (!imgs.length) continue;
        const section = document.createElement('section');
        section.innerHTML = `<h2>${board.title}</h2><p class="note">${board.note}</p><div class="grid"></div>`;
        const grid = section.querySelector('.grid');
        for (const img of imgs) {
          const fig = document.createElement('figure');
          fig.innerHTML = `<img src="/moodboards/${img.file}" alt="" loading="lazy" />
            <figcaption><div class="credit">${img.credit} · added ${img.added}</div>
            <ul>${img.takeaways.map((t) => `<li>${t}</li>`).join('')}</ul></figcaption>`;
          grid.appendChild(fig);
        }
        root.appendChild(section);
      }
    </script>
  </body>
</html>
